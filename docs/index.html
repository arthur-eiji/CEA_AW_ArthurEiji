<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adventure Works — Painel de Vendas</title>
<meta name="description" content="Painel interativo de vendas da Adventure Works, construído sobre o data warehouse dimensional (Databricks + dbt).">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%232a78d6'/%3E%3Cpath d='M4 12V8M8 12V4M12 12V6' stroke='%23fff' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/styles.css?v=2026-11-10">
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="brand">
      <h1>Adventure Works — Painel de Vendas</h1>
      <p class="sub" id="subtitle">Carregando o data warehouse…</p>
    </div>
    <div class="top-right">
      <span class="audit" id="audit" hidden></span>
      <button class="ghost" id="themeBtn" type="button" title="Alternar entre tema automático, claro e escuro">Tema: automático</button>
    </div>
  </header>

  <div id="status" class="status" role="status">Carregando dados…</div>

  <main id="app" hidden>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Páginas do painel"></nav>

    <!-- Filtros: uma única linha, acima de tudo o que eles afetam (valem para todas as páginas) -->
    <section class="filters" id="filters" aria-label="Filtros">
      <span class="flbl">Período</span>
      <select id="preset" aria-label="Período pré-definido"></select>
      <span class="fsep">de</span>
      <select id="monthFrom" aria-label="Mês inicial"></select>
      <span class="fsep">até</span>
      <select id="monthTo" aria-label="Mês final"></select>
      <span class="fdiv" aria-hidden="true"></span>
      <span id="msHost" class="ms-host"></span>
      <span class="fright">
        <label class="flbl" for="sortSel">Ordenar por</label>
        <select id="sortSel"></select>
        <button class="link" id="clearBtn" type="button">Limpar filtros</button>
      </span>
    </section>

    <div class="ctx" id="ctx" aria-live="polite"></div>

    <div id="pages"></div>

    <footer class="foot" id="footer"></footer>
  </main>
</div>

<div id="tip" class="tip" role="tooltip" hidden></div>
<script src="assets/app.js?v=2026-11-10"></script>
</body>
</html>
